name: "Active Investigation / Fake News Fact-Checker"
version: "2.0.0"
description: "An RL environment where an AI agent uses search and read tools to investigate claims before submitting a verdict (true/false/unverified). Features adversarial tasks with disinformation traps."
tasks:
  - id: "task_easy"
    difficulty: "easy"
    description: "Popular myth - A widely-believed false claim debunked by authoritative sources."
  - id: "task_medium"
    difficulty: "medium"
    description: "True claim vs. disinformation - A factually correct claim surrounded by loud debunking blogs. Agent must weigh source credibility."
  - id: "task_hard"
    difficulty: "hard"
    description: "Misquoted study trap - A claim citing specific statistics from a real study, but the numbers are fabricated. Agent must read the actual study abstract to catch the discrepancy."
